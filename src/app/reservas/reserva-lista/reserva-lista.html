<h2>Reservas</h2>

<a mat-flat-button routerLink="/reservas/novo">Nova reserva</a>

@if (reservas().length === 0) {
  <p>Nenhuma reserva.</p>

} @else {

  <table mat-table [dataSource]="reservas()">
    <ng-container matColumnDef="espaco">
      <th mat-header-cell *matHeaderCellDef>Espaço</th>
      <td mat-cell *matCellDef="let r">{{ r.espacoNome }}</td>
    </ng-container>

    <ng-container matColumnDef="usuario">
      <th mat-header-cell *matHeaderCellDef>Usuário</th>
      <td mat-cell *matCellDef="let r">{{ r.usuarioNome }}</td>
    </ng-container>

    <ng-container matColumnDef="inicio">
      <th mat-header-cell *matHeaderCellDef>Início</th>
      <td mat-cell *matCellDef="let r">{{ r.inicio | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="fim">
      <th mat-header-cell *matHeaderCellDef>Fim</th>
      <td mat-cell *matCellDef="let r">{{ r.fim | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let r">{{ r.status }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let r">
        @if (r.status === 'CONFIRMADA') {
          <button mat-button (click)="cancelar(r)">Cancelar</button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>
}
